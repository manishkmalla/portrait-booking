services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-booking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-booking}
      POSTGRES_DB: ${POSTGRES_DB:-booking}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-booking} -d ${POSTGRES_DB:-booking}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Hostname "db" only resolves inside this compose network, so these are
      # always the container-network URLs regardless of any .env on the host.
      DATABASE_URL: postgres://${POSTGRES_USER:-booking}:${POSTGRES_PASSWORD:-booking}@db:5432/${POSTGRES_DB:-booking}
      TEST_DATABASE_URL: postgres://${POSTGRES_USER:-booking}:${POSTGRES_PASSWORD:-booking}@db:5432/booking_test
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-min-32-characters-long}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      PORT: ${PORT:-3000}
    ports:
      - "3000:3000"
    volumes:
      - ./api:/app
      - /app/node_modules

  web:
    build: ./web
    depends_on:
      - api
    environment:
      # "api" only resolves inside this compose network; always the
      # container-network target regardless of any .env on the host.
      API_PROXY_TARGET: http://api:3000
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - /app/node_modules

volumes:
  pgdata:
